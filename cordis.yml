# Standalone root composition: use when the host owns ctx.compaction. The Web
# bundle patch uses the same root engine as a cross-preset automatic fallback;
# preset-cordis.yml is only needed when a user preset must replace its isolate.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- id: dsh-token-optimizer
  name: dsh-token-optimizer
  config:
    compaction: true
    thresholdRatio: 0.625
    retainRatio: 0.16
    auto: true
    smallResultChars: 1200
    largeResultChars: 12000
    previewChars: 1000
    mediumHeadChars: 4096
    mediumTailChars: 1024
    archiveRoot: !!js dshHomePath('token-optimizer-spill')
