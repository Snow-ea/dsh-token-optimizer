# Root-level result policy, retrieval tool, session projection, Web panel, and
# cross-preset automatic compaction. The root engine observes every agent's
# pressure event, so shipped preset isolation does not require a user copy.
# Set `compaction: false` below to drop this early-compaction engine while
# keeping every other capability; see the README "Configuration" section.
- insert:
    - id: dsh-token-optimizer
      name: dsh-token-optimizer
      config:
        compaction: true
        thresholdRatio: 0.625
        retainRatio: 0.16
        auto: true
        smallResultChars: 1200
        largeResultChars: 12000
        previewChars: 1000
        mediumHeadChars: 4096
        mediumTailChars: 1024
        archiveRoot: !!js dshHomePath('token-optimizer-spill')
