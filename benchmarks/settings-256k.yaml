llm-pi-ai:
  providers:
    openai:
      baseURL: https://huablog.org/v1
      models:
        - id: gpt-5.5
          name: GPT-5.5
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-5.5-pro
          name: GPT-5.5 Pro
          contextWindow: 1050000
          maxTokens: 128000
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          contextWindow: 1050000
          maxTokens: 128000
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 1050000
          maxTokens: 128000
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
          contextWindow: 256000
          maxTokens: 128000
          input:
            - text
            - image
        - id: gpt-realtime-2.1
          name: GPT-Realtime-2.1
          contextWindow: 128000
          maxTokens: 32000
      apiKeyEnv: OPENAI_API_KEY
agent-default-model:
  provider: openai
  model: gpt-5.6-terra
  reasoningEffort: xhigh
agent-presets:
  default: standard
