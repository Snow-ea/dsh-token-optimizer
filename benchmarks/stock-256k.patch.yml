- id: settings
  config:
    path: 'benchmarks/settings-256k.yaml'
    watch: false
    debounceMs: 100

- id: tool-fs
  config:
    readLimit: 2000
    readMaxLineLength: 3000000
    readMaxBytes: 3000000
    readStreamMinSize: 1

- id: tool-result-pruner
  disabled: true

- id: dsh-token-optimizer
  disabled: true
